<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#200318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset">
<title>T. NAVIDEÑO · Reset Ultimate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#1a0213; --bg1:#200318; --plum:#7d1463; --fuchsia:#d6249f; --neon:#ff3fb4; --neon2:#ff7ad1; --violet:#a3a3ad;
  --text:#fff; --muted:rgba(255,255,255,.66); --faint:rgba(255,255,255,.38);
  --glass:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 60%,rgba(255,255,255,.08));
  --stroke:rgba(255,160,220,.30);
  --disp:'Anton','Impact','Haettenschweiler','Arial Narrow Bold',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.9,.2,1); --snap:cubic-bezier(.3,1.6,.4,1);
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background-color:#1a0213;background-image:radial-gradient(120% 70% at 85% -5%,#c0178f 0%,rgba(192,23,143,0) 55%),
             radial-gradient(90% 60% at -10% 40%,#6d0f5a 0%,rgba(109,15,90,0) 60%),
             radial-gradient(120% 80% at 50% 110%,#4b0a45 0%,#1a0213 70%);
  background-attachment:fixed;color:var(--text);font-family:var(--body);font-size:15px;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
#topo{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#topo svg{width:100%;height:100%}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--st) + 8px) 16px calc(var(--sb) + 110px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
.hl{color:var(--neon)}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}
.brand{display:flex;align-items:baseline;gap:8px;line-height:1}
.brand b{font-family:var(--disp);font-size:34px;letter-spacing:.02em;font-weight:400;transform:skewX(-8deg);display:inline-block;
  background:linear-gradient(180deg,#fff 30%,#ffc1e8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,63,180,.55))}
.brand span{font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.32em;color:var(--neon)}
.tpill{max-width:52%;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.tpill em{overflow:hidden;text-overflow:ellipsis;font-style:normal}

/* ---------- glass ---------- */
.glass{position:relative;background:var(--glass);border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.18),0 12px 30px -14px rgba(0,0,0,.7)}
.carta{position:relative;border-radius:24px;padding:9px;isolation:isolate;overflow:hidden;
  background:linear-gradient(155deg,rgba(176,28,132,.62),rgba(92,12,78,.62) 55%,rgba(60,6,52,.7));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--stroke);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25),0 22px 44px -18px rgba(0,0,0,.75),0 0 40px -20px rgba(255,63,180,.6)}
.carta::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--topo) center/cover;opacity:.55;pointer-events:none}
.carta::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 60% at 10% -10%,rgba(255,255,255,.22),transparent 50%)}
.frame{border:1.3px solid rgba(255,255,255,.78);border-radius:7px;margin:0;padding:12px 14px 14px;min-width:0}
.frame>legend{font-family:var(--cond);font-weight:800;letter-spacing:.16em;font-size:11.5px;color:var(--neon);padding:0 7px;margin-left:8px;text-transform:uppercase;text-shadow:0 0 10px rgba(255,63,180,.6)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;
  font-family:var(--cond);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#ff4fbf,#d6249f 55%,#9c1279);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 28px -8px rgba(255,63,180,.8)}
.btn.ghost{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2)}
.btn.danger{background:linear-gradient(135deg,#ff5a7a,#c81d4f);box-shadow:0 10px 24px -10px rgba(255,60,100,.9)}
.btn.block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
  font-family:var(--cond);font-weight:700;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:transform .15s}
.pill:active{transform:scale(.94)}
.pill.hot{background:linear-gradient(135deg,#ff4fbf,#c41b8f);border-color:transparent}
.pill.red{color:#ff9bb4;border-color:rgba(255,120,150,.4)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:inline-grid;place-items:center;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:34px;height:34px;border-radius:11px}
.icon-btn.sm .ic{width:17px;height:17px}

/* ---------- sections ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:26px 2px 12px}
.sec h2{margin:0;font-family:var(--disp);font-weight:400;font-size:26px;letter-spacing:.02em;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left}
.sec h2 small{font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--neon);margin-left:6px}
.sec .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stack{display:grid;gap:12px}
.round-h{font-family:var(--cond);font-weight:800;letter-spacing:.22em;font-size:12px;color:var(--neon2);text-transform:uppercase;margin:16px 4px 8px;display:flex;align-items:center;gap:10px}
.round-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,63,180,.6),transparent)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--disp);font-weight:400;font-size:28px;color:#fff;text-transform:uppercase;margin-bottom:6px;transform:skewX(-6deg)}

/* ---------- CTA ---------- */
.cta{display:block;width:100%;text-align:left}
.cta .frame{padding:18px 18px 20px}
.cta-small{font-family:var(--cond);font-weight:700;letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:rgba(255,255,255,.8)}
.cta-big{font-family:var(--disp);font-size:52px;line-height:.92;text-transform:uppercase;margin:6px 0 8px;transform:skewX(-7deg);transform-origin:left;letter-spacing:.01em}
.cta-big .hl{display:block;color:transparent;-webkit-text-stroke:1.6px var(--neon);text-shadow:0 0 22px rgba(255,63,180,.55)}
.cta .go{position:absolute;right:22px;bottom:24px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,#ff4fbf,#c41b8f);box-shadow:0 0 0 6px rgba(255,63,180,.18),0 10px 30px -6px rgba(255,63,180,.9);animation:pulse 2.2s infinite}
.cta .go .ic{width:28px;height:28px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(255,63,180,.18),0 10px 30px -6px rgba(255,63,180,.9)}50%{box-shadow:0 0 0 14px rgba(255,63,180,0),0 10px 30px -6px rgba(255,63,180,.9)}}

.live-banner{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:18px;margin-bottom:12px;font-family:var(--cond);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-align:left;
  border-color:rgba(255,63,180,.55)!important;box-shadow:0 0 0 1px rgba(255,63,180,.25),0 0 30px -8px rgba(255,63,180,.8)}
.live-banner .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:#ff2a6d;box-shadow:0 0 0 0 rgba(255,42,109,.7);animation:blink 1.2s infinite;flex:none}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(255,42,109,.7)}100%{box-shadow:0 0 0 10px rgba(255,42,109,0)}}
.clock-mini{font-family:var(--disp);font-size:20px;font-weight:400;color:var(--neon2);letter-spacing:.03em}

/* ---------- match rows ---------- */
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:100%;padding:14px 14px 12px;border-radius:18px;text-align:left;transition:transform .15s}
.match:active{transform:scale(.98)}
.match .tn{font-family:var(--cond);font-weight:800;font-size:18px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.match .tn.r{text-align:right}
.match .tn.win{color:var(--neon2)}
.match .mid{font-family:var(--disp);font-size:26px;letter-spacing:.02em;min-width:76px;text-align:center}
.match .mid.vs{font-size:16px;color:var(--faint);font-family:var(--cond);font-weight:800;letter-spacing:.2em}
.match .meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.st{padding:3px 8px;border-radius:6px;font-weight:800}
.st.pending{background:rgba(255,255,255,.08);color:var(--muted)}
.st.live{background:#ff2a6d;color:#fff}
.st.done{background:rgba(255,63,180,.18);color:var(--neon2)}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}

/* ---------- teams ---------- */
.addrow{display:flex;gap:8px}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,63,180,.25)}
textarea.field{padding:12px 14px;min-height:150px;resize:vertical}
select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select.field option{background:#200318;color:#fff}
.lbl{display:block;font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--neon2);margin:14px 2px 7px}
.team-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.team-name{flex:1;min-width:0}
.team-name b{display:block;font-family:var(--disp);font-weight:400;font-size:27px;line-height:1;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-name small{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.chev{transition:transform .3s var(--ease)}
.open .chev{transform:rotate(180deg)}
.roster{margin-top:12px;display:grid;gap:6px;animation:drop .35s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.prow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:12px;background:rgba(0,0,0,.18)}
.prow .pn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:6px 0}
.prow .num{font-family:var(--disp);color:var(--neon2);font-size:16px;min-width:22px;text-align:center}
.g{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;font-family:var(--cond);font-weight:900;font-size:15px;flex:none}
.g.F{background:linear-gradient(135deg,#ff4fbf,#c41b8f);color:#fff}
.g.M{background:linear-gradient(135deg,#7a1560,#2c0522);color:#fff}
.gseg{display:flex;gap:6px}
.gseg button{flex:1;min-height:44px;border-radius:12px;font-family:var(--cond);font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.gseg button.on.F{background:linear-gradient(135deg,#ff4fbf,#c41b8f);border-color:transparent}
.gseg button.on.M{background:linear-gradient(135deg,#7a1560,#2c0522);border-color:transparent}
.team-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- segmented ---------- */
.seg{position:relative;display:flex;padding:4px;border-radius:16px;gap:4px}
.seg button{flex:1;position:relative;z-index:1;min-height:40px;border-radius:12px;font-family:var(--cond);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:color .25s}
.seg button.on{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:12px;background:linear-gradient(135deg,#ff4fbf,#b3177f);box-shadow:0 6px 18px -6px rgba(255,63,180,.9),inset 0 1px 0 rgba(255,255,255,.4);transition:left .38s var(--snap),width .38s var(--snap)}

/* ---------- leaders ---------- */
.lb-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.08);position:relative}
.lb-row:last-child{border-bottom:0}
.lb-rank{font-family:var(--disp);font-size:24px;text-align:center;color:var(--faint);transform:skewX(-6deg)}
.lb-row.top1 .lb-rank{color:#ffd1ef;text-shadow:0 0 14px var(--neon)}
.lb-row.top2 .lb-rank,.lb-row.top3 .lb-rank{color:var(--neon2)}
.lb-name{min-width:0}
.lb-name b{display:block;font-family:var(--cond);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-name small{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lb-val{font-family:var(--disp);font-size:30px;min-width:40px;text-align:right}
.lb-bar{position:absolute;left:44px;right:0;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--neon),transparent);transform-origin:left;animation:grow 0.9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.lb-hero{display:flex;align-items:center;gap:14px;padding:6px 2px 12px}
.lb-hero .big{font-family:var(--disp);font-size:64px;line-height:.85;color:transparent;-webkit-text-stroke:1.5px var(--neon);transform:skewX(-8deg)}
.tbl{width:100%;border-collapse:collapse;font-family:var(--cond);font-weight:700;font-size:15px}
.tbl th{font-weight:800;font-size:11.5px;letter-spacing:.14em;color:var(--neon2);text-align:center;padding:6px 2px;text-transform:uppercase}
.tbl td{text-align:center;padding:10px 2px;border-top:1px solid rgba(255,255,255,.08)}
.tbl td.tm{text-align:left;text-transform:uppercase;font-weight:800;font-size:16px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl td.pts{font-family:var(--disp);font-size:20px;font-weight:400;color:var(--neon2)}

/* ---------- nav ---------- */
#nav{position:fixed;left:50%;bottom:calc(var(--sb) + 12px);transform:translateX(-50%);z-index:20;width:min(calc(100% - 28px),520px);display:flex;padding:6px;border-radius:26px}
#nav button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:20px;font-family:var(--cond);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:color .25s}
#nav button .ic{width:23px;height:23px}
#nav button.on{color:#fff}
#nav .thumb{position:absolute;top:6px;bottom:6px;border-radius:20px;background:linear-gradient(135deg,rgba(255,79,191,.95),rgba(179,23,127,.95));box-shadow:0 8px 22px -6px rgba(255,63,180,.9),inset 0 1px 0 rgba(255,255,255,.45);transition:left .42s var(--snap),width .42s var(--snap)}

/* ---------- sheets / dialogs ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;
  border-radius:30px 30px 0 0;padding:10px 18px calc(var(--sb) + 22px);
  background:linear-gradient(170deg,rgba(120,18,98,.86),rgba(40,4,38,.94));-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,160,220,.3);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 -20px 60px -10px rgba(0,0,0,.6);
  animation:sheetIn .42s var(--ease)}
.sheet.out{animation:sheetOut .25s ease-in forwards}
.backdrop.out{animation:fade .25s reverse forwards}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(105%)}}
.grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.35);margin:0 auto 12px}
.sheet h3{margin:4px 0 4px;font-family:var(--disp);font-weight:400;font-size:32px;line-height:1;text-transform:uppercase;transform:skewX(-6deg);transform-origin:left}
.sheet h3 .hl{color:transparent;-webkit-text-stroke:1.3px var(--neon)}
.sheet .sub{color:var(--muted);margin:0 0 6px;font-size:14px}
.sheet-foot{display:flex;gap:10px;margin-top:20px}
.sheet-foot .btn{flex:1}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chips.four{grid-template-columns:repeat(4,1fr)}
.chip{position:relative;display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 10px;border-radius:15px;text-align:left;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  font-family:var(--cond);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em;transition:transform .15s,background .2s,border-color .2s}
.chip:active{transform:scale(.95)}
.chip span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,rgba(255,79,191,.9),rgba(160,20,115,.9));border-color:rgba(255,255,255,.5);box-shadow:0 8px 22px -8px rgba(255,63,180,.9)}
.chip.center{justify-content:center;text-align:center}
.chip .badge{position:absolute;top:-7px;right:-5px;width:22px;height:22px;border-radius:50%;background:#fff;color:#b3177f;display:grid;place-items:center;font-family:var(--disp);font-size:13px;animation:pop .35s var(--snap)}
@keyframes pop{from{transform:scale(0)}}
.chip.ghosty{border-style:dashed;color:var(--muted)}
.dialog{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;pointer-events:none}.dialog .box{pointer-events:auto}
.dialog .box{width:min(100%,360px);border-radius:28px;padding:22px;text-align:center;animation:popIn .35s var(--snap)}
@keyframes popIn{from{transform:scale(.8);opacity:0}}
.dialog h4{margin:0 0 8px;font-family:var(--disp);font-weight:400;font-size:28px;text-transform:uppercase;transform:skewX(-6deg)}
.dialog p{margin:0 0 18px;color:var(--muted)}
.dialog .row{display:flex;gap:10px}.dialog .row .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);z-index:90;transform:translate(-50%,-160%);padding:12px 18px;border-radius:16px;font-family:var(--cond);font-weight:800;letter-spacing:.06em;text-transform:uppercase;transition:transform .45s var(--snap);max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}

/* ---------- live match ---------- */
#live{position:fixed;inset:0;z-index:30;overflow:auto;-webkit-overflow-scrolling:touch;display:none;
  background-color:#1a0213;background-image:radial-gradient(130% 60% at 50% -10%,#c0178f 0%,rgba(192,23,143,0) 60%),radial-gradient(120% 80% at 50% 120%,#5a0c50,#1a0213 70%)}
#live.on{display:block;animation:liveIn .45s var(--ease)}
@keyframes liveIn{from{opacity:0;transform:scale(1.06)}}
#live .topo2{position:fixed;inset:0;pointer-events:none;opacity:.5}
.live-wrap{position:relative;max-width:560px;margin:0 auto;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 30px)}
.live-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.live-title{flex:1;text-align:center;font-family:var(--cond);font-weight:800;letter-spacing:.2em;font-size:13px;text-transform:uppercase;color:var(--neon2)}
.clock-card .frame{text-align:center;padding:6px 12px 14px}
.clock{font-family:var(--disp);font-size:clamp(80px,26vw,128px);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;transform:skewX(-6deg);
  text-shadow:0 0 30px rgba(255,63,180,.55);transition:color .3s}
.clock.warn{color:#ffd1ef;animation:warn 1s infinite}
.clock.over{color:#ff3f7a;text-shadow:0 0 30px rgba(255,40,100,.8)}
@keyframes warn{50%{transform:skewX(-6deg) scale(1.04);text-shadow:0 0 50px rgba(255,63,180,1)}}
.clock-sub{font-family:var(--cond);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-bottom:12px}
.clock-ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.clock-ctl .adj{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-family:var(--disp);font-size:20px;transition:transform .15s}
.clock-ctl .adj:active{transform:scale(.9)}
.play{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff4fbf,#c41b8f);box-shadow:0 0 0 7px rgba(255,63,180,.18),0 14px 34px -8px rgba(255,63,180,1),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s}
.play:active{transform:scale(.9)}
.play .ic{width:36px;height:36px}
.play.idle{animation:pulse 1.6s infinite}
.clock-links{display:flex;justify-content:center;gap:18px;margin-top:12px}
.lnk{font-family:var(--cond);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--neon2);padding:6px}
.score-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sc .frame{text-align:center;padding:4px 8px 10px;display:flex;flex-direction:column;align-items:center;height:100%}
.sc .frame>legend{max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 auto}
.sc-name{font-family:var(--cond);font-weight:900;font-size:19px;line-height:1.05;text-transform:uppercase;min-height:40px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;word-break:break-word}
.sc-num{font-family:var(--disp);font-size:clamp(74px,24vw,112px);line-height:1;transform:skewX(-7deg);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.sc-num.slam{animation:slam .7s var(--snap)}
@keyframes slam{0%{transform:skewX(-7deg) scale(2.4);opacity:0;filter:blur(8px)}55%{transform:skewX(-7deg) scale(.9);opacity:1;filter:blur(0)}100%{transform:skewX(-7deg) scale(1)}}
.sc.flash::after{content:"";position:absolute;inset:-40%;z-index:2;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);animation:sweep .8s ease-out forwards;pointer-events:none}
@keyframes sweep{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.sc.lead{border-color:rgba(255,63,180,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 40px -10px rgba(255,63,180,.95)}
.btn-point{width:100%;min-height:62px;border-radius:16px;margin-top:auto;font-family:var(--disp);font-size:24px;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(135deg,#ff4fbf,#c41b8f 60%,#8f0f6c);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 26px -10px rgba(255,63,180,1);transition:transform .12s}
.btn-point:active{transform:scale(.94)}
.log-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;width:100%}
.log-item:last-child{border-bottom:0}
.log-item .tag{font-family:var(--disp);font-size:18px;min-width:48px;text-align:center;padding:4px 6px;border-radius:9px;background:rgba(255,255,255,.08)}
.log-item .tag.a{background:rgba(255,63,180,.22);color:#ffc1e8}
.log-item .tag.b{background:rgba(255,255,255,.12);color:#ededf2}
.log-item .who{min-width:0}
.log-item .who b{display:block;font-family:var(--cond);font-weight:800;font-size:16px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-item .who small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-item.newest{animation:slideL .5s var(--ease)}
@keyframes slideL{from{transform:translateX(-30px);opacity:0}}
.final-tag{font-family:var(--disp);font-size:22px;letter-spacing:.06em;color:var(--neon2);text-align:center;margin:4px 0 0}

/* ---------- big FX overlays ---------- */
#fx{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.fx-goal{position:absolute;inset:0;display:grid;place-items:center}
.fx-goal .stripe{position:absolute;left:-20%;right:-20%;height:44%;top:28%;transform:skewY(-9deg) translateX(-120%);
  background:linear-gradient(90deg,#ff4fbf,#d6249f 50%,#7a0f62);box-shadow:0 0 80px rgba(255,63,180,.8);animation:stripe 1.6s var(--ease) forwards}
.fx-goal .stripe.s2{height:6%;top:24%;background:#fff;animation-delay:.06s;opacity:.85}
.fx-goal .stripe.s3{height:4%;top:74%;background:#ff9fdc;animation-delay:.1s}
@keyframes stripe{0%{transform:skewY(-9deg) translateX(-120%)}22%{transform:skewY(-9deg) translateX(0)}78%{transform:skewY(-9deg) translateX(0)}100%{transform:skewY(-9deg) translateX(120%)}}
.fx-goal .txt{position:relative;text-align:center;transform:skewY(-9deg);animation:txt 1.6s var(--ease) forwards}
.fx-goal .txt b{display:block;font-family:var(--disp);font-weight:400;font-size:clamp(84px,27vw,150px);line-height:.85;text-transform:uppercase;transform:skewX(-10deg);color:#fff;text-shadow:6px 6px 0 #7a0f62,0 0 40px rgba(255,255,255,.5)}
.fx-goal .txt span{display:block;font-family:var(--cond);font-weight:900;font-style:italic;font-size:22px;letter-spacing:.12em;text-transform:uppercase;margin-top:8px;padding:0 20px}
.fx-goal .txt small{display:block;font-family:var(--cond);font-weight:800;font-size:15px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
@keyframes txt{0%{opacity:0;transform:skewY(-9deg) translateX(60vw)}22%{opacity:1;transform:skewY(-9deg) translateX(0) scale(1.08)}30%{transform:skewY(-9deg) scale(1)}78%{opacity:1;transform:skewY(-9deg) translateX(-2vw)}100%{opacity:0;transform:skewY(-9deg) translateX(-60vw)}}
.fx-vs{position:absolute;inset:0;background:rgba(0,0,0,.75);animation:fade .2s, fadeOut .35s 1.55s forwards}
@keyframes fadeOut{to{opacity:0}}
.fx-vs .side{position:absolute;left:0;right:0;height:50%;display:flex;align-items:center;padding:0 24px;font-family:var(--disp);font-size:clamp(40px,13vw,72px);line-height:.9;text-transform:uppercase;word-break:break-word}
.fx-vs .side.a{top:0;background:linear-gradient(135deg,#ff4fbf,#9c1279);clip-path:polygon(0 0,100% 0,100% 82%,0 100%);animation:inL .5s var(--ease) both;align-items:flex-end;padding-bottom:16%}
.fx-vs .side.b{bottom:0;background:linear-gradient(135deg,#2c0522,#10010b);clip-path:polygon(0 18%,100% 0,100% 100%,0 100%);animation:inR .5s .08s var(--ease) both;justify-content:flex-end;text-align:right;align-items:flex-start;padding-top:16%}
.fx-vs .side span{transform:skewX(-8deg);display:block}
@keyframes inL{from{transform:translateX(-100%)}}
@keyframes inR{from{transform:translateX(100%)}}
.fx-vs .vs{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#b3177f;font-family:var(--disp);font-size:52px;box-shadow:0 0 0 8px rgba(255,255,255,.25),0 0 60px rgba(255,63,180,1);animation:vsIn .55s .35s var(--snap) both}
@keyframes vsIn{from{transform:scale(3) rotate(-20deg);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

/* ---------- enter animations ---------- */
.enter > *{animation:rise .55s var(--ease) both}
.enter > *:nth-child(2){animation-delay:.04s}.enter > *:nth-child(3){animation-delay:.08s}.enter > *:nth-child(4){animation-delay:.12s}
.enter > *:nth-child(5){animation-delay:.16s}.enter > *:nth-child(6){animation-delay:.2s}.enter > *:nth-child(7){animation-delay:.24s}.enter > *:nth-child(n+8){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(26px) skewY(2deg)}}
.stagger > *{animation:slideIn .5s var(--ease) both}
.stagger > *:nth-child(2){animation-delay:.05s}.stagger > *:nth-child(3){animation-delay:.1s}.stagger > *:nth-child(4){animation-delay:.15s}.stagger > *:nth-child(5){animation-delay:.2s}.stagger > *:nth-child(n+6){animation-delay:.25s}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}}

/* ================= V2 · liquid glass, legibilidad, profundidad ================= */
:root{--muted:rgba(255,255,255,.8);--faint:rgba(255,255,255,.58)}
body{background:#1a0213;font-size:15.5px}
#bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#26041c,#1a0213 60%,#10010b)}
#bgfx i{position:absolute;border-radius:50%;will-change:transform}
#bgfx i:nth-child(1){width:120vmax;height:120vmax;left:-50vmax;top:-60vmax;background:radial-gradient(circle,rgba(230,43,171,.5),rgba(214,36,159,0) 62%);animation:orb1 26s ease-in-out infinite alternate}
#bgfx i:nth-child(2){width:110vmax;height:110vmax;right:-55vmax;top:20vh;background:radial-gradient(circle,rgba(170,20,120,.34),rgba(150,16,105,0) 62%);animation:orb2 32s ease-in-out infinite alternate}
#bgfx i:nth-child(3){width:100vmax;height:100vmax;left:-35vmax;bottom:-55vmax;background:radial-gradient(circle,rgba(255,63,180,.32),rgba(255,63,180,0) 62%);animation:orb3 38s ease-in-out infinite alternate}
@keyframes orb1{to{transform:translate(22vw,14vh) scale(1.15)}}
@keyframes orb2{to{transform:translate(-26vw,-18vh) scale(.9)}}
@keyframes orb3{to{transform:translate(30vw,-12vh) scale(1.2)}}
#topo{opacity:.27;overflow:hidden}
#topo svg,.topo2 svg{width:140%;height:140%;margin:-20%;animation:topoDrift 60s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes topoDrift{from{transform:translate(-5%,-4%) rotate(-4deg) scale(1)}to{transform:translate(5%,4%) rotate(5deg) scale(1.14)}}
#live .topo2{opacity:.14;overflow:hidden}

/* superficies lisas para el texto */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 40%),rgba(56,7,43,.56);border:1px solid rgba(255,255,255,.15);
  -webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.05),0 18px 40px -20px rgba(0,0,0,.85)}
.carta{border-radius:34px;padding:8px;
  background:radial-gradient(130% 55% at 50% 0%,rgba(0,0,0,.55),rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(26,26,30,.66),rgba(46,46,52,.5));
  -webkit-backdrop-filter:blur(36px) saturate(170%);backdrop-filter:blur(36px) saturate(170%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.38),inset 0 -26px 46px -26px rgba(255,63,180,.42),inset 0 0 0 1px rgba(255,255,255,.03),0 34px 60px -28px rgba(0,0,0,.9),0 0 60px -30px rgba(255,63,180,.7)}
.carta::before{display:none}
.carta::after{background:radial-gradient(90% 40% at 18% 0%,rgba(255,255,255,.2),transparent 60%)}
.frame{border:1px solid rgba(255,255,255,.3);border-radius:27px;padding:14px 16px 16px}
.frame>legend{font-size:12px;margin-left:14px;letter-spacing:.18em;color:#ff8fd8;text-shadow:0 0 12px rgba(255,63,180,.7)}
.match{border-radius:26px;padding:16px 16px 13px}
.match .meta{font-size:12.5px;color:var(--faint)}
.match .mid.vs{color:var(--muted)}
.empty{color:var(--muted)}
.sec h2 small{font-size:13px;color:#ff8fd8}
.round-h{font-size:13px;color:#ffa5df}
.lbl{font-size:12.5px;color:#ffa5df}
.cta-small{font-size:12.5px;color:#fff}
.clock-sub,.live-title{font-size:13px;color:#ffc4ea}
.lnk{font-size:13px;color:#ffc4ea}
.team-name small,.lb-name small{font-size:13.5px}
.prow{background:rgba(20,1,14,.42);border-radius:16px}
.field{background:rgba(20,1,14,.55);border-radius:18px;border-color:rgba(255,255,255,.2)}
.field::placeholder{color:rgba(255,255,255,.5)}

/* hero */
.cta.carta{background:radial-gradient(120% 60% at 50% -5%,rgba(0,0,0,.82),rgba(0,0,0,0) 72%),linear-gradient(180deg,#8d1270 0%,#e62bab 58%,#ff9fdc 125%);border-color:rgba(255,255,255,.3);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -30px 50px -24px rgba(255,255,255,.35),0 40px 70px -30px rgba(255,63,180,.75),0 30px 60px -30px rgba(0,0,0,.9)}
.cta .frame{border-color:rgba(255,255,255,.5)}
.cta .frame>legend{color:#fff;text-shadow:none}
.cta-big{text-shadow:0 4px 18px rgba(0,0,0,.45)}
.cta-big .hl{-webkit-text-stroke:1.6px #fff;text-shadow:none}
.cta .go{background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(255,214,240,.9));color:#b3177f;box-shadow:0 0 0 7px rgba(255,255,255,.2),0 14px 30px -8px rgba(0,0,0,.7),inset 0 -6px 10px rgba(214,36,159,.25)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 7px rgba(255,255,255,.2),0 14px 30px -8px rgba(0,0,0,.7)}50%{box-shadow:0 0 0 16px rgba(255,255,255,0),0 14px 30px -8px rgba(0,0,0,.7)}}

/* botones líquidos */
.btn{border-radius:99px;min-height:54px;position:relative;overflow:hidden}
.btn.primary,.btn-point,.pill.hot,.play{background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 46%),linear-gradient(135deg,#ff58c4,#d6249f 55%,#8f0f6c);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -8px 14px -6px rgba(60,0,45,.6),0 14px 30px -10px rgba(255,63,180,.9)}
.btn.danger{background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 46%),linear-gradient(135deg,#ff6a86,#c81d4f);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 12px 26px -10px rgba(255,60,100,.9)}
.btn.ghost,.pill,.icon-btn,.chip,.clock-ctl .adj,.gseg button{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 55%),rgba(84,11,65,.42);border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -6px 10px -6px rgba(255,255,255,.14),0 8px 18px -10px rgba(0,0,0,.7)}
.pill.hot{border-color:transparent}
.icon-btn{border-radius:50%;width:44px;height:44px}
.icon-btn.sm{border-radius:50%;width:36px;height:36px}
.clock-ctl .adj{border-radius:50%;width:60px;height:60px}
.btn-point{border-radius:99px;min-height:60px}
.chip{border-radius:22px;min-height:56px}
.chip.on{background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 46%),linear-gradient(135deg,#ff58c4,#b3177f);border-color:rgba(255,255,255,.55)}
.gseg button{border-radius:99px}
.g{border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.seg{border-radius:99px;padding:5px}

.seg .thumb{top:5px;bottom:5px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 46%),linear-gradient(135deg,#ff58c4,#b3177f);transition:left .5s var(--snap),width .5s var(--snap)}
.btn:active,.pill:active,.chip:active,.icon-btn:active{filter:brightness(1.25)}

/* nav de burbujas */
#nav{width:auto;max-width:calc(100% - 20px);gap:8px;padding:8px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),rgba(44,5,33,.5);

/* hojas, live */
.sheet{border-radius:40px 40px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 22%),rgba(38,4,29,.8);-webkit-backdrop-filter:blur(44px) saturate(180%);backdrop-filter:blur(44px) saturate(180%);border-color:rgba(255,255,255,.2)}
.sheet .sub{font-size:15px;color:var(--muted)}
#live{background:rgba(24,2,17,.72);-webkit-backdrop-filter:blur(46px) saturate(160%);backdrop-filter:blur(46px) saturate(160%)}
.sc.lead{border-color:rgba(255,160,220,.75);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -40px 60px -26px rgba(255,63,180,.7),0 0 50px -12px rgba(255,63,180,.95)}
.log-item .who small{font-size:13.5px;color:var(--muted)}
.dialog .box{border-radius:36px}
.dialog{z-index:110}

/* header */

.brand .wm{display:flex;flex-direction:column}
.brand b{font-size:30px}
.hdr-r{display:flex;align-items:center;gap:8px;min-width:0;max-width:56%}
.tpill{max-width:100%;border-radius:99px;font-size:14.5px;padding:11px 14px}
.role{font-family:var(--cond);font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14)}

/* roles */
body.keeper .adm{display:none!important}

  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.34),inset 0 -26px 46px -28px rgba(255,63,180,.5),0 34px 60px -28px rgba(0,0,0,.95),0 0 60px -32px rgba(255,63,180,.75)}

/* texto de contorno fucsia */
.ol{color:transparent!important;-webkit-text-stroke:1.5px var(--neon);text-shadow:0 0 18px rgba(255,63,180,.35)}

#splash i{width:min(56vw,240px);height:3px;border-radius:3px;margin-top:22px;background:linear-gradient(90deg,#ff3fb4,#fff);transform-origin:left;transform:scaleX(0);box-shadow:0 0 14px rgba(255,63,180,.9);animation:spBar 1s .25s cubic-bezier(.6,0,.2,1) forwards}

/* páginas */
main{--dir:1}
main.leave{animation:pageOut .15s ease-in forwards}
@keyframes pageOut{to{opacity:0;transform:translate3d(calc(var(--dir) * -30px),0,0)}}
.enter > *{animation:pageIn .62s cubic-bezier(.16,1,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translate3d(calc(var(--dir) * 54px),16px,0) scale(.965)}}
.enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}.enter > *:nth-child(4){animation-delay:.15s}.enter > *:nth-child(5){animation-delay:.2s}.enter > *:nth-child(n+6){animation-delay:.25s}
.ptitle .ch{display:inline-block}

@keyframes chIn{from{opacity:0;transform:translateY(70%) rotate(8deg) scale(.8)}}
.enter .ptitle small{animation:fade .6s .1s both}

.rv.in{opacity:1;transform:none;transition:opacity .5s ease,transform .7s cubic-bezier(.16,1,.3,1)}

/* toque: resorte + onda de luz */

.btn:active,.pill:active,.chip:active,.icon-btn:active,.btn-point:active,.key:active,.play:active,.clock-ctl .adj:active,.gseg button:active{transform:scale(.93);transition-duration:.07s}
.match:active,.role-card:active,.cta:active,.log-item:active{transform:scale(.972);transition-duration:.07s}
#nav button{transition:padding .5s var(--snap),background .3s,color .25s,transform .5s var(--snap)}
#nav button:active{transform:scale(.88);transition-duration:.07s}
.icon-btn,.key,.role-card,.log-item,#nav button,.seg button,.pill,.match,.clock-ctl .adj,.play,.btn-point,.gseg button{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,.12) 40%,rgba(255,255,255,0) 62%);transform:scale(0);animation:rip .65s cubic-bezier(.2,.7,.2,1) forwards;z-index:3}
@keyframes rip{to{transform:scale(1);opacity:0}}
.chip{overflow:hidden}

@keyframes navPop{0%{transform:scale(.5) rotate(-18deg)}60%{transform:scale(1.2) rotate(4deg)}}

/* hojas, entrada, partido */
.sheet{animation:sheetIn .55s cubic-bezier(.16,1,.3,1)}
.sheet-enter > *{animation:rise .5s cubic-bezier(.16,1,.3,1) both;animation-delay:.1s}
.sheet-enter > *:nth-child(3){animation-delay:.14s}.sheet-enter > *:nth-child(4){animation-delay:.18s}.sheet-enter > *:nth-child(5){animation-delay:.22s}.sheet-enter > *:nth-child(n+6){animation-delay:.26s}
.sheet-enter > .grab{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
#gate.out{animation:gateOut .36s ease-in forwards}
@keyframes gateOut{to{opacity:0;transform:scale(1.08)}}
.g-enter > *{animation:pageIn .65s cubic-bezier(.16,1,.3,1) both}
.g-enter > *:nth-child(2){animation-delay:.07s}.g-enter > *:nth-child(3){animation-delay:.14s}.g-enter > *:nth-child(4){animation-delay:.21s}.g-enter > *:nth-child(n+5){animation-delay:.28s}
.g-enter .key{animation:pop .45s var(--snap) both}
.g-enter .key:nth-child(3n+2){animation-delay:.05s}.g-enter .key:nth-child(3n){animation-delay:.1s}
.dots i.f{animation:pop .3s var(--snap)}
#live.on{animation:liveIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes liveIn{from{opacity:0;transform:translateY(40px) scale(.97)}}
#live.out{animation:liveOut .22s ease-in forwards}

#live.on:not(.shake) .live-wrap > *{animation:pageIn .6s cubic-bezier(.16,1,.3,1) backwards}

#live .live-wrap > *:nth-child(2){animation-delay:.06s}#live .live-wrap > *:nth-child(3){animation-delay:.12s}#live .live-wrap > *:nth-child(n+4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== V9 · canchas, estados, roles y lectura al sol ===== */

const J=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
const metaOf=t=>({name:t.name,format:t.format||'custom',duration:t.duration||20,cap:t.cap||0,byes:t.byes||{},roundLabels:t.roundLabels||{},roundTimes:t.roundTimes||{},throws:t.throws||[],created:t.created||0});
const coreOf=(tm,i)=>({name:tm.name,color:tm.color,order:i});
const plOf=tm=>(tm.players||[]).map(p=>({id:p.id,name:p.name,g:p.g||'F',num:p.num||''}));
const mOf=m=>({id:m.id,a:m.a||null,b:m.b||null,round:+m.round||1,court:+m.court||1,duration:+m.duration||20,cap:+m.cap||0,status:m.status||'pending',
  events:(m.events||[]).map(e=>({id:e.id,team:e.team,goal:e.goal||null,assist:e.assist||null,at:e.at||0,by:e.by||''})),elapsed:m.elapsed||0,runningSince:m.runningSince||null,po:!!m.po,label:m.label||'',slot:m.slot||null});
const snapT=t=>({meta:J(metaOf(t)),teams:Object.fromEntries(t.teams.map((tm,i)=>[tm.id,{core:J(coreOf(tm,i)),pl:J(plOf(tm))}])),matches:Object.fromEntries(t.matches.map(m=>[m.id,J(mOf(m))]))});
const fullOf=t=>({meta:metaOf(t),teams:Object.fromEntries(t.teams.map((tm,i)=>[tm.id,{...coreOf(tm,i),players:plOf(tm)}])),matches:Object.fromEntries(t.matches.map(m=>[m.id,mOf(m)]))});
const toArr=v=>!v?[]:Array.isArray(v)?v.filter(x=>x!=null):Object.values(v);
function toObj(v){if(!v)return{};if(Array.isArray(v)){const o={};v.forEach((x,i)=>{if(x!=null)o[i]=x});return o}return v}
function fromCloud(id,x){const mt=x.meta||{};
  const t={id,name:mt.name||'Torneo',format:mt.format||'custom',duration:mt.duration||20,cap:mt.cap||0,byes:toObj(mt.byes),roundLabels:toObj(mt.roundLabels),roundTimes:toObj(mt.roundTimes),throws:toArr(mt.throws),created:mt.created||0};
  t.teams=Object.entries(x.teams||{}).map(([k,tm])=>({id:k,name:tm.name||'Equipo',color:tm.color||'#ff3fb4',order:tm.order||0,players:plOf({players:toArr(tm.players)})})).sort((a,b)=>a.order-b.order);
  t.teams.forEach(tm=>delete tm.order);
  t.matches=Object.entries(x.matches||{}).map(([k,m])=>mOf({...m,id:k,events:toArr(m.events)})).sort(mSort);
  return t}

function save(){
  store.set(KEY+'-active',S.activeId);
  if(!CLOUD){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}return}
  if(!net.db)return;
  const up={},seen=new Set();
  S.tournaments.forEach(t=>{seen.add(t.id);const old=net.last[t.id],nw=snapT(t),base='tournaments/'+t.id+'/';
    if(!old)up['tournaments/'+t.id]=fullOf(t);
    else{
      if(old.meta!==nw.meta)up[base+'meta']=metaOf(t);
      t.teams.forEach((tm,i)=>{const o=old.teams[tm.id],n=nw.teams[tm.id],p=base+'teams/'+tm.id;
        if(!o){up[p]={...coreOf(tm,i),players:plOf(tm)};return}
        if(o.core!==n.core){up[p+'/name']=tm.name;up[p+'/color']=tm.color;up[p+'/order']=i}
        if(o.pl!==n.pl)up[p+'/players']=plOf(tm)});
      Object.keys(old.teams).forEach(k=>{if(!nw.teams[k])up[base+'teams/'+k]=null});
      t.matches.forEach(m=>{if(old.matches[m.id]!==nw.matches[m.id])up[base+'matches/'+m.id]=mOf(m)});
      Object.keys(old.matches).forEach(k=>{if(!nw.matches[k])up[base+'matches/'+k]=null});
    }
    net.last[t.id]=nw});
  Object.keys(net.last).forEach(k=>{if(!seen.has(k)){up['tournaments/'+k]=null;delete net.last[k]}});
  if(!Object.keys(up).length)return;
  net.db.ref().update(up).catch(err=>{console.warn(err);toast('No se guardó: sin permiso. Vuelve a entrar con el PIN.')});
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function cloudInit(){
  const b='https://www.gstatic.com/firebasejs/10.12.2/';
  try{await loadScript(b+'firebase-app-compat.js');await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-database-compat.js')])}
  catch(e){toast('Sin internet: no se pudo cargar el torneo');return}
  firebase.initializeApp(FIREBASE_CONFIG);net.db=firebase.database();
  net.db.ref('.info/serverTimeOffset').on('value',s=>{net.off=s.val()||0});
  let wasOn=null;
  net.db.ref('.info/connected').on('value',s=>{net.on=!!s.val();const b=$('#netBtn');if(b){b.classList.toggle('on',net.on);b.classList.toggle('off',!net.on)}
    if(wasOn===true&&!net.on)toast('Sin señal · lo anotado se sube al volver');if(wasOn===false&&net.on)toast('Conectado de nuevo');wasOn=net.on});
  net.db.ref('tournaments').on('value',snap=>{const v=snap.val()||{};
    S.tournaments=Object.entries(v).map(([id,x])=>fromCloud(id,x)).sort((a,b)=>(b.created||0)-(a.created||0));
    net.last={};S.tournaments.forEach(t=>net.last[t.id]=snapT(t));
    if(!T())S.activeId=(S.tournaments.find(t=>t.id===DEFAULT_T)||S.tournaments[0]||{}).id||null;
    if(!net.loaded){net.loaded=true;ui.animate=true}
    softRender()},err=>{console.warn(err);toast('No se pudo leer la base de datos')});
  setTimeout(()=>{if(!net.loaded){ui.busy=true;softRender()}},12000);
  let offT=null;
  document.addEventListener('visibilitychange',()=>{if(!net.db)return;
    if(document.visibilityState==='hidden'){if(!canScore())offT=setTimeout(()=>net.db.goOffline(),45000)}
    else{clearTimeout(offT);net.db.goOnline()}});
  try{const c=await firebase.auth().signInAnonymously();net.uid=c.user.uid}
  catch(e){console.warn(e);toast('Activa el acceso anónimo en Firebase')}
}

function topoContours(W,H,seed){
  let sd=seed;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const mk=(gx,gy)=>{const v=[];for(let i=0;i<=gx;i++){v.push([]);for(let j=0;j<=gy;j++)v[i].push(rnd())}return{gx,gy,v}};
  const A=mk(4,7),B=mk(8,14);
  const sm=t=>t*t*t*(t*(t*6-15)+10);
  const samp=(n,x,y)=>{const fx=x/W*n.gx,fy=y/H*n.gy;const i=Math.min(n.gx-1,Math.floor(fx)),j=Math.min(n.gy-1,Math.floor(fy));const u=sm(fx-i),w=sm(fy-j);
    return n.v[i][j]*(1-u)*(1-w)+n.v[i+1][j]*u*(1-w)+n.v[i][j+1]*(1-u)*w+n.v[i+1][j+1]*u*w};
  const f=(x,y)=>samp(A,x,y)*.78+samp(B,x,y)*.22;
  const c=5,nx=Math.ceil(W/c),ny=Math.ceil(H/c);const g=[];
  for(let i=0;i<=nx;i++){g.push(new Float32Array(ny+1));for(let j=0;j<=ny;j++)g[i][j]=f(Math.min(W,i*c),Math.min(H,j*c))}
  const thin=[],bold=[];const N=22;
  for(let L=1;L<N;L++){const lv=.12+L*(.76/N);let d='';
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){
      const a=g[i][j],b=g[i+1][j],cc=g[i+1][j+1],e=g[i][j+1];
      const idx=(a>lv?8:0)|(b>lv?4:0)|(cc>lv?2:0)|(e>lv?1:0);if(idx===0||idx===15)continue;
      const x=i*c,y=j*c;
      const Tp=()=>[x+c*(lv-a)/(b-a),y],R=()=>[x+c,y+c*(lv-b)/(cc-b)],Bm=()=>[x+c*(lv-e)/(cc-e),y+c],Lf=()=>[x,y+c*(lv-a)/(e-a)];
      let segs;
      switch(idx){case 1:case 14:segs=[[Lf(),Bm()]];break;case 2:case 13:segs=[[Bm(),R()]];break;case 3:case 12:segs=[[Lf(),R()]];break;
        case 4:case 11:segs=[[Tp(),R()]];break;case 6:case 9:segs=[[Tp(),Bm()]];break;case 7:case 8:segs=[[Lf(),Tp()]];break;
        case 5:segs=[[Lf(),Tp()],[Bm(),R()]];break;case 10:segs=[[Lf(),Bm()],[Tp(),R()]];break}
      for(const[p,q]of segs)d+='M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)}
    (L%4===0?bold:thin).push(d)}
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9fdc"/><stop offset=".45" stop-color="#ff3fb4"/><stop offset="1" stop-color="#8a0f66"/></linearGradient>
    <linearGradient id="tb" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ff7ad1"/><stop offset="1" stop-color="#ff3fb4"/></linearGradient></defs>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${thin.join('')}" stroke="url(#tg)" stroke-width=".7" stroke-opacity=".6"/>
    <path d="${bold.join('')}" stroke="#ff3fb4" stroke-width="5" stroke-opacity=".12"/><path d="${bold.join('')}" stroke="url(#tb)" stroke-width="1.7" stroke-opacity=".95"/></g></svg>`}
(function(){const svg=topoContours(420,900,20261);document.documentElement.style.setProperty('--topoBg',`url("data:image/svg+xml,${encodeURIComponent(svg)}")`)})();

async function verifyKeeper(v){const t=T();if(!t)return false;
  if(!CLOUD)return!!t.pinHash&&t.pinHash===hashPin(v);
  if(!net.uid){toast('Sin conexión con el torneo');return false}
  return tryPin(`access/${t.id}/${net.uid}`,v)}
async function verifyAdmin(v){if(!CLOUD)return!!S.pin&&hashPin(v)===S.pin;
  if(!net.uid){toast('Sin conexión con la base de datos');return false}
  return tryPin(`admins/${net.uid}`,v)}
function adminIn(){setSession({role:'admin',name:'Admin'});closeGate();
  if(CLOUD&&net.loaded&&!S.tournaments.length){S.tournaments.unshift(seedT());S.activeId=DEFAULT_T;save();net.db.ref('secrets/pins/'+DEFAULT_T).set(SEED_PIN).catch(()=>{});toast('Calendario T. NAVIDEÑO cargado')}
  else toast('Modo administrador');
  ui.animate=true;render()}
function gateKey(d){
  if(gate.busy)return;gate.err='';if(gate.buf.length>=4)return;gate.buf+=d;buzz(8);
  if(gate.buf.length<4){renderGate();return}
  renderGate();
  setTimeout(async()=>{const v=gate.buf;
    if(gate.mode==='kpin'||gate.mode==='pin'){gate.busy=true;renderGate();
      const ok=gate.mode==='kpin'?await verifyKeeper(v):await verifyAdmin(v);gate.busy=false;gate.buf='';
      if(ok){if(gate.mode==='kpin'){gate.mode='kname';renderGate();setTimeout(()=>$('#keeperName')&&$('#keeperName').focus(),100)}else adminIn()}
      else{gate.err='PIN incorrecto';buzz([60,40,60]);renderGate()}}
    else if(gate.mode==='create'){gate.buf='';gate.first=v;gate.mode='confirm';renderGate()}
    else if(gate.mode==='confirm'){gate.buf='';if(v===gate.first){S.pin=hashPin(v);save();adminIn()}else{gate.err='No coincide, intenta de nuevo';gate.mode='create';renderGate()}}
  },220);
}
function countUp(root){root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;if(!to)return;const t0=performance.now(),d=650+Math.min(700,to*35);
  const step=n=>{const p=Math.min(1,(n-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1&&el.isConnected)requestAnimationFrame(step)};el.textContent='0';requestAnimationFrame(step)})}
let rvIO=null;
function revealOnScroll(root){if(!('IntersectionObserver'in window))return;if(rvIO)rvIO.disconnect();

/* ---------------- LÍDERES ---------------- */
function stats(t){
  const g={},a={};
  t.matches.forEach(m=>m.events.forEach(e=>{if(e.goal)g[e.goal]=(g[e.goal]||0)+1;if(e.assist)a[e.assist]=(a[e.assist]||0)+1}));
  return{g,a}}
function leaderList(t,map,gender,st){
  const rows=Object.entries(map).map(([id,v])=>({p:findPlayer(t,id),v,id})).filter(r=>r.p&&r.p.g===gender).sort((x,y)=>y.v-x.v||x.p.name.localeCompare(y.p.name));
  if(!rows.length)return`<div class="muted" style="padding:14px 4px;text-align:center">Todavía sin datos</div>`;
  const max=rows[0].v;let rank=0,prev=null;
  return `<div class="stagger">`+rows.map((r,i)=>{if(r.v!==prev){rank=i+1;prev=r.v}
    return `<div class="lb-row top${rank}"><div class="lb-rank">${rank}</div><div class="lb-name"><b>${esc(r.p.name)}</b><small><span class="sw" style="background:${r.p.team.color};width:8px;height:8px"></span> ${esc(r.p.team.name)}</small></div><div class="lb-val"><span data-count="${r.v}">${r.v}</span>${st?`<small>${st.g[r.id]||0} G · ${st.a[r.id]||0} A</small>`:''}</div><div class="lb-bar" style="width:calc((100% - 44px) * ${(r.v/max).toFixed(3)});right:auto;animation-delay:${.1+i*.05}s"></div></div>`}).join('')+`</div>`}
/* Ranking WFDF (Reglas de Ultimate 2025–2028, Apéndice B3):
   se ordena por partidos ganados; cada grupo empatado se ordena con los criterios B3.4
   (sin forfeits en este torneo) y cada subgrupo que siga empatado vuelve a empezar desde el criterio 1 (B3.3.2). */
const TB=[
  {k:'h2hW',l:'Victorias entre los empatados'},
  {k:'h2hGD',l:'Diferencia de puntos entre los empatados'},
  {k:'coGD',l:'Diferencia de puntos vs rivales comunes'},
  {k:'h2hGPG',l:'Puntos anotados por juego entre los empatados'},
  {k:'coGPG',l:'Puntos anotados por juego vs rivales comunes'},
  {k:'throw',l:'Lanzamiento de disco'}];
function tbValues(c,grp,ms,t){
  const G=new Set(grp),v={};grp.forEach(id=>v[id]={w:0,gd:0,gf:0,n:0});
  const res=(id,m)=>{const a=sc(m,'a'),b=sc(m,'b');return m.a===id?[a,b]:[b,a]};
  if(c.k.startsWith('h2h')){ms.filter(m=>G.has(m.a)&&G.has(m.b)).forEach(m=>[m.a,m.b].forEach(id=>{const[f,ag]=res(id,m);v[id].gd+=f-ag;v[id].gf+=f;v[id].n++;if(f>ag)v[id].w++}))}
  else if(c.k.startsWith('co')){
    const opp=id=>new Set(ms.filter(m=>m.a===id||m.b===id).map(m=>m.a===id?m.b:m.a).filter(x=>!G.has(x)));
    const sets=grp.map(opp);const common=[...sets[0]].filter(x=>sets.every(st=>st.has(x)));const C=new Set(common);
    ms.forEach(m=>grp.forEach(id=>{if((m.a===id&&C.has(m.b))||(m.b===id&&C.has(m.a))){const[f,ag]=res(id,m);v[id].gd+=f-ag;v[id].gf+=f;v[id].n++}}));
  }
  const th=t.throws||[];
  return grp.map(id=>{const x=v[id];
    if(c.k==='h2hW')return x.w;if(c.k==='h2hGD'||c.k==='coGD')return x.gd;
    if(c.k==='h2hGPG'||c.k==='coGPG')return x.n?Math.round(x.gf/x.n*1e6)/1e6:0;
    if(c.k==='throw')return grp.every(g=>th.includes(g))?-th.indexOf(id):0;return 0})}
function rankTied(grp,ms,t){
  if(grp.length<2)return grp.map(id=>({id,tb:null,tie:null}));
  for(const c of TB){
    const vals=tbValues(c,grp,ms,t);const keys=[...new Set(vals)].sort((a,b)=>b-a);
    if(keys.length===1)continue;
    const out=[];keys.forEach(kv=>{const sub=grp.filter((id,i)=>vals[i]===kv);
      if(sub.length===1)out.push({id:sub[0],tb:c.l,tie:null});else out.push(...rankTied(sub,ms,t).map(r=>({...r,tb:r.tb||c.l})))});
    return out}
  const key=grp.slice().sort().join('|');return grp.map(id=>({id,tb:null,tie:key}))}
function standings(t){
  const s={};t.teams.forEach(tm=>s[tm.id]={tm,pj:0,g:0,p:0,e:0,pf:0,pc:0});
  const ms=t.matches.filter(m=>m.status==='done'&&!m.po&&s[m.a]&&s[m.b]);
  ms.forEach(m=>{const A=s[m.a],B=s[m.b];const a=sc(m,'a'),b=sc(m,'b');
    A.pj++;B.pj++;A.pf+=a;A.pc+=b;B.pf+=b;B.pc+=a;if(a>b){A.g++;B.p++}else if(b>a){B.g++;A.p++}else{A.e++;B.e++}});
  const wins=[...new Set(Object.values(s).map(r=>r.g))].sort((a,b)=>b-a);
  const out=[];
  wins.forEach(w=>{const grp=Object.values(s).filter(r=>r.g===w).map(r=>r.tm.id).sort((a,b)=>s[a].tm.name.localeCompare(s[b].tm.name));
    const tied=grp.length>1;
    rankTied(grp,ms,t).forEach(r=>out.push({...s[r.id],tb:tied?r.tb:null,tie:r.tie}))});
  let pos=0;out.forEach((r,i)=>{if(!(i>0&&r.tie&&out[i-1].tie===r.tie))pos=i+1;r.pos=pos});
  return out}
const regDone=t=>t.matches.filter(m=>!m.po).every(m=>m.status==='done');
function viewLideres(t){
  if(!net.loaded)return loadingT();
  if(!t)return emptyT();
  let h=seg('lb',[['mvp','MVP'],['goles','Goles'],['asist','Asist.'],['tabla','Tabla']],ui.lb);
  if(ui.lb==='tabla'){
    const rows=standings(t);
    h+=`<div class="carta" style="margin-top:14px"><fieldset class="frame"><legend>Carta posiciones</legend>${rows.length?`<table class="tbl"><thead><tr><th></th><th style="text-align:left">Equipo</th><th>PJ</th><th>G</th><th>P</th><th>DIF</th><th>PF</th></tr></thead><tbody class="stagger">`+
      rows.map((r,i)=>`<tr class="${i===3&&rows.length>4?'cut':''} ${r.tie?'tied':''}"><td class="q" style="color:${i<4?'var(--neon2)':'var(--faint)'}">${r.tie?'=':''}${r.pos}</td><td class="tm"><span class="sw" style="background:${r.tm.color};width:9px;height:9px"></span> ${esc(r.tm.name)}${r.tb||r.tie?`<small class="tbn">${r.tie?'Empate sin resolver':esc(r.tb)}</small>`:''}</td><td>${r.pj}</td><td class="pts">${r.g}</td><td>${r.p}</td><td>${r.pf-r.pc>0?'+':''}${r.pf-r.pc}</td><td>${r.pf}</td></tr>`).join('')+`</tbody></table><div class="muted" style="font-size:12px;margin-top:10px">Los 4 primeros (arriba de la línea) pasan a semis. Solo cuentan partidos de ronda regular finalizados. Debajo de cada equipo empatado se ve qué criterio lo ubicó.</div>`:'<div class="empty">Sin equipos</div>'}</fieldset></div>`;
    const ties=[...new Set(rows.filter(r=>r.tie).map(r=>r.tie))];
    if(ties.length)h+=`<div class="carta" style="margin-top:14px"><fieldset class="frame"><legend>Empate sin resolver</legend>${ties.map(k=>{const tr=rows.filter(r=>r.tie===k);return `<p style="margin:2px 0 10px">${tr.map(r=>'<b>'+esc(r.tm.name)+'</b>').join(', ')} siguen igualados en los 5 criterios. Según WFDF B3.4.7 se define con <b>lanzamiento de disco</b>: cada equipo nombra a una persona que lanza un disco desde atrás de la línea de gol hacia la marca del brick del otro lado; gana el más cercano.</p>${regDone(t)?`<button class="btn primary block adm" data-action="throw-sheet" data-k="${esc(k)}">${ic.flag} Registrar resultado del lanzamiento</button>`:`<div class="muted" style="font-size:12.5px">Todavía faltan partidos: el empate puede deshacerse solo.</div>`}`}).join('')}</fieldset></div>`;
    h+=`<details class="carta wfdf" style="margin-top:14px"><summary>¿Cómo se desempata? · WFDF 2025–2028, Apéndice B3</summary><ol><li>Más partidos ganados en la ronda regular.</li><li>Si hay empate, se ordena <b>solo el grupo empatado</b> con:<ol type="a">${TB.map(c=>'<li>'+c.l+'</li>').join('')}</ol></li><li>Si un criterio separa a unos pero otros siguen igualados, ese subgrupo <b>vuelve a empezar desde (a)</b>.</li><li>"Rivales comunes" son los equipos contra los que jugaron <b>todos</b> los empatados. Como cada equipo juega 8 de 11, puede que dos empatados no se hayan enfrentado: entonces (a) y (b) no los separan y se pasa a (c).</li></ol><p class="muted" style="font-size:12.5px">No hubo forfeits en el sistema, así que el criterio de "menos forfeits" (B3.4.2) se omite.</p></details>`;
    return h}
  h+=`<div style="height:10px"></div>`+seg('lbg',[['F','Femenino'],['M','Masculino']],ui.lbg);
  const st=stats(t);const mvp={};Object.entries(st.g).forEach(([k,v])=>mvp[k]=(mvp[k]||0)+v);Object.entries(st.a).forEach(([k,v])=>mvp[k]=(mvp[k]||0)+v);
  const isM=ui.lb==='mvp';const map=isM?mvp:ui.lb==='goles'?st.g:st.a;const word=isM?'Goles + asist.':ui.lb==='goles'?'Goles':'Asistencias';
  const g=ui.lbg,l=g==='F'?'Femenino':'Masculino';
  const total=Object.entries(map).filter(([id])=>{const p=findPlayer(t,id);return p&&p.g===g}).reduce((s,[,v])=>s+v,0);
  h+=`<div class="carta" style="margin-top:14px"><fieldset class="frame"><legend>${isM?'MVP':'Líderes'} ${l}</legend>
    <div class="lb-hero"><div class="big" data-count="${total}">${total}</div><div><div style="font-family:var(--disp);font-size:26px;line-height:1;text-transform:uppercase;transform:skewX(-6deg)">${word}</div><div class="muted" style="font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px">${l} · total</div></div></div>
    ${leaderList(t,map,g,isM?st:null)}</fieldset></div>`;
  return h}

function tick(){

      if(cs&&ui.liveId===m.id){beep();buzz([400,150,400,150,800]);fxGoal('¡Tiempo!','Se acabó el reloj',`${sideName(t,m,'a')} ${sc(m,'a')} – ${sc(m,'b')} ${sideName(t,m,'b')}`)}

    if(r>0)ui.al.delete(m.id);

function roundRobin(ids){const arr=[...ids];if(arr.length%2)arr.push(null);const n=arr.length,rounds=[];
  for(let r=0;r<n-1;r++){const pairs=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b)pairs.push(r%2?[b,a]:[a,b])}rounds.push(pairs);arr.splice(1,0,arr.pop())}return rounds}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  case 'dur':if(!m)break;m.duration=Math.max(1,m.duration+ +el.dataset.d);save();renderLive();break;
  case 'reset-clock':if(m&&await ask('¿Reiniciar reloj?','El tiempo vuelve a '+m.duration+':00. Los puntos se mantienen.','Reiniciar',false)){const m2=liveM();if(m2){m2.elapsed=0;m2.runningSince=null;save();renderLive()}}break;
  case 'edit-clock':if(!m||m.status==='done')break;ui.sheet={type:'clock'};openSheet(clockSheet());break;
  case 'save-clock':{if(!m)break;const d=Math.max(1,+$('#ckDur').value||m.duration);m.duration=d;const r0=parseMS($('#ckRem').value);if(r0!==null){m.elapsed=Math.max(0,d*60000-r0);if(m.runningSince)m.runningSince=now()}save();closeSheet();renderLive();break}
  case 'score':if(!m)break;ui.sheet={type:'score',mid:m.id,team:el.dataset.side,step:'goal',goal:null,assist:null};openSheet(scoreSheet());buzz(10);break;
  case 'add-event-manual':{if(!m)break;ui.sheet={type:'score',mid:m.id,team:'a',step:'goal',goal:null,assist:null,manual:true};
    const ev={id:uid(),team:'a',goal:null,assist:null,at:elapsed(m),by:(session&&session.name)||''};m.events.push(ev);ui.newestEvent=ev.id;save();renderLive();ui.sheet.eventId=ev.id;openSheet(scoreSheet());break}
  case 'pick-goal':{const s=ui.sheet;s.goal=id||null;if(s.assist===s.goal)s.assist='';s.step='assist';refreshSheet(scoreSheet());buzz(10);break}
  case 'back-goal':ui.sheet.step='goal';refreshSheet(scoreSheet());break;
  case 'pick-assist':{const s=ui.sheet;if(s.eventId){s.assist=id||'';refreshSheet(scoreSheet());break}commitPoint(s.goal,id||null);break}
  case 'quick-add-toggle':ui.sheet.quick=!ui.sheet.quick;refreshSheet(scoreSheet());setTimeout(()=>$('#qaName')&&$('#qaName').focus(),50);break;
  case 'quick-add':{const n=$('#qaName').value.trim();if(!n){toast('Escribe un nombre');break}const mt=t.matches.find(x=>x.id===ui.sheet.mid);const tm=team(t,ui.sheet.team==='a'?mt.a:mt.b);tm.players.push({id:uid(),name:n,g:el.dataset.g,num:''});save();ui.sheet.quick=false;refreshSheet(scoreSheet());toast(n+' agregado');break}
  case 'edit-event':{if(!m)break;const ev=m.events.find(x=>x.id===id);if(!ev)break;ui.sheet={type:'score',mid:m.id,team:ev.team,step:'goal',goal:ev.goal,assist:ev.assist||'',eventId:ev.id};openSheet(scoreSheet());break}
  case 'save-event':{if(!m)break;const s=ui.sheet;const ev=m.events.find(x=>x.id===s.eventId);if(!ev){closeSheet();break}ev.team=s.team;ev.goal=s.goal||null;ev.assist=s.assist||null;if(ev.assist===ev.goal)ev.assist=null;
    const at=parseMS($('#evTime').value);if(at!==null)ev.at=at;m.events.sort((x,y)=>x.at-y.at);save();closeSheet();renderLive();toast('Jugada guardada');break}
  case 'del-event':{const evId=ui.sheet.eventId;if(await ask('¿Borrar jugada?','Se resta el punto del marcador.')){const m2=liveM();if(m2){m2.events=m2.events.filter(x=>x.id!==evId);save()}closeSheet();renderLive()}break}
  case 'undo':{if(!m)break;const ev=m.events[m.events.length-1];if(!ev)break;if(await ask('¿Deshacer último punto?',`${ev.goal?pname(t,ev.goal):'Gol'} · ${tn(t,m[ev.team])}`,'Deshacer',true)){const m2=liveM();if(m2){m2.events=m2.events.filter(x=>x.id!==ev.id);save();renderLive();toast('Punto deshecho')}}break}
  case 'finish':if(m&&await ask('¿Finalizar partido?',`${tn(t,m.a)} ${sc(m,'a')} – ${sc(m,'b')} ${tn(t,m.b)}`,'Finalizar',false))finishMatch(m.id);break;
  case 'reopen':if(!m)break;m.status='live';save();renderLive();toast('Partido reabierto');break;
  }
});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.btn,.pill,.chip,.icon-btn,.match,.btn-point,.key,.role-card,#nav button,.play,.adj,.cta,.seg button,.log-item,.gseg button,.donebar');if(!el||el.disabled)return;
  const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=document.createElement('span');s.className='rip';
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;el.appendChild(s);setTimeout(()=>s.remove(),700)},{passive:true});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;
  if(id==='newTeam'){e.preventDefault();document.querySelector('[data-action="add-team"]').click()}
  else if(id==='keeperName'){e.preventDefault();document.querySelector('[data-action="gate-keeper-go"]').click()}
  else if(id&&id.startsWith('np-')){e.preventDefault();toast('Toca +F o +M para agregar')}});
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tournaments))throw 0;
  if(await ask('¿Importar respaldo?','Se reemplazan los torneos por los del archivo.','Importar',false)){S.tournaments=d.tournaments.map(t=>({...t,matches:(t.matches||[]).map(m=>({...mOf(m),runningSince:null}))}));if(!T())S.activeId=S.tournaments[0]?.id||null;save();ui.animate=true;render();toast('Respaldo importado')}}catch(_){toast('Archivo no válido')}e.target.value=''});
document.addEventListener('input',e=>{if(e.target.id==='durCustom'&&ui.sheet){const v=+e.target.value;if(v>0){ui.sheet.dur=v;document.querySelectorAll('[data-action="pick-dur"]').forEach(b=>b.classList.remove('on'))}}});
window.addEventListener('resize',()=>{placeSegThumbs()});

/* ---------------- arranque ---------------- */
if(!CLOUD){if(!S.tournaments.length){S.tournaments.push(seedT());S.activeId=DEFAULT_T;save()}if(!T())S.activeId=S.tournaments[0]?.id||null}
if(session&&session.role==='keeper'&&urlT&&session.tid!==urlT)setSession(null);
buildXmas();render();placeSegThumbs();
setTimeout(()=>{ui.animate=true;render()},1250);
setTimeout(()=>{const sp=$('#splash');sp&&sp.remove()},2150);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderNav();placeSegThumbs()});
if(CLOUD)cloudInit();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
